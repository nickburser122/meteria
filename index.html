<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><em>Materia</em></div>
    <input id="title" class="title" dir="auto" autocomplete="off" spellcheck="false" placeholder="Untitled ledger" aria-label="Ledger title">
    <label class="find">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="find" placeholder="Filter" autocomplete="off" spellcheck="false" aria-label="Filter records">
    </label>
    <button class="btn ghost" id="colsBtn">Columns</button>
    <button class="btn solid" id="outBtn">Print &amp; export</button>
  </header>

  <section class="add" aria-label="Add records">
    <input id="qName" dir="auto" placeholder="Type a drug name…" autocomplete="off" spellcheck="false" aria-label="Drug name">
    <div class="step" id="qCopies" data-min="1" data-max="50" data-tip="One row per price">
      <button data-d="-1" tabindex="-1" aria-label="Fewer rows">−</button>
      <span class="x">×</span>
      <input value="1" inputmode="numeric" autocomplete="off" aria-label="Number of rows">
      <button data-d="1" tabindex="-1" aria-label="More rows">+</button>
    </div>
    <button class="btn solid" id="qAdd">Add <kbd>↵</kbd></button>
    <p class="hint" id="qHint"></p>
  </section>

  <main class="grid" id="grid">
    <table id="tbl"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    <div class="empty" id="empty" hidden>
      <h2>An empty shelf</h2>
      <p>Type a name above, set × to the number of prices you hold, and press Enter.</p>
      <button class="btn ghost">Load a small sample</button>
    </div>
  </main>

  <footer class="status" id="status"></footer>
</div>

<div class="pop" id="sug" role="listbox" hidden></div>
<div class="pop cols" id="cols" hidden></div>
<div class="scrim" id="scrim"></div>

<aside class="sheet" id="sheet" aria-label="Print and export">
  <header>
    <h2>Print <em>&amp;</em> export</h2>
    <button class="ic" id="sheetX" aria-label="Close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
  </header>
  <div class="fld">
    <span>Rows per page</span>
    <div class="line">
      <div class="step" id="pPer" data-min="5" data-max="200">
        <button data-d="-1" tabindex="-1" aria-label="Fewer">−</button>
        <input value="25" inputmode="numeric" autocomplete="off" aria-label="Rows per page">
        <button data-d="1" tabindex="-1" aria-label="More">+</button>
      </div>
      <div class="chips" id="pPre"></div>
    </div>
  </div>
  <div class="fld">
    <span>Cumulative sum</span>
    <div class="seg" id="pMode">
      <button data-v="none">Off</button>
      <button data-v="run">Running</button>
      <button data-v="page">Page end</button>
    </div>
    <p class="hint" id="pModeHint"></p>
  </div>
  <div class="fld" id="pSumF">
    <span>Sum these columns</span>
    <div class="chips" id="pSum"></div>
  </div>
  <div class="pv" id="pv"></div>
  <p class="hint" id="pInfo"></p>
  <div class="acts">
    <button class="btn ghost" id="xlsxBtn">Export .xlsx</button>
    <button class="btn solid" id="printBtn">Print</button>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>
<div id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
