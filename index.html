<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfaf6">
<title>Materia — drug ledger</title>
<link rel="icon" href="favicon.svg">
<script>(function(){try{var p=localStorage.getItem('materia.theme')||'system';document.documentElement.dataset.theme=p==='dark'||(p!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){}})()</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><em>Materia</em></div>
    <input id="title" class="title" dir="auto" autocomplete="off" spellcheck="false" placeholder="Untitled ledger" aria-label="Ledger title">
    <label class="find">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="find" placeholder="Filter" autocomplete="off" spellcheck="false" aria-label="Filter records">
    </label>
    <button class="btn ghost" id="colsBtn">Columns</button>
    <button class="btn ghost" id="impBtn">Import</button>
    <button class="btn solid" id="outBtn">Print &amp; export</button>
    <button class="btn ghost icb" id="themeBtn" aria-label="Theme"></button>
  </header>

  <section class="add" aria-label="Add records">
    <input id="qName" dir="auto" placeholder="Type a drug name…" autocomplete="off" spellcheck="false" aria-label="Drug name">
    <div class="step" id="qCopies" data-min="1" data-max="50" data-tip="One row per price">
      <button data-d="-1" tabindex="-1" aria-label="Fewer rows">−</button>
      <span class="x">×</span>
      <input value="1" inputmode="numeric" autocomplete="off" aria-label="Number of rows">
      <button data-d="1" tabindex="-1" aria-label="More rows">+</button>
    </div>
    <button class="btn solid" id="qAdd">Add <kbd>↵</kbd></button>
    <p class="hint" id="qHint"></p>
  </section>

  <main class="grid" id="grid">
    <table id="tbl"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    <div class="empty" id="empty" hidden>
      <h2>No records</h2>
      <p>Add a name above or import a workbook.</p>
      <button class="btn ghost">Load sample</button>
    </div>
  </main>

  <footer class="status" id="status"></footer>
</div>

<div class="pop" id="sug" role="listbox" hidden></div>
<div class="pop cols" id="cols" hidden></div>
<div class="scrim" id="scrim"></div>

<aside class="sheet" id="sheet" aria-label="Print and export">
  <header>
    <h2>Print <em>&amp;</em> export</h2>
    <button class="ic" id="sheetX" aria-label="Close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
  </header>
  <div class="fld">
    <span>Rows per page</span>
    <div class="line">
      <div class="step" id="pPer" data-min="5" data-max="200">
        <button data-d="-1" tabindex="-1" aria-label="Fewer">−</button>
        <input value="25" inputmode="numeric" autocomplete="off" aria-label="Rows per page">
        <button data-d="1" tabindex="-1" aria-label="More">+</button>
      </div>
      <div class="chips" id="pPre"></div>
    </div>
  </div>
  <div class="fld">
    <span>Cumulative sum</span>
    <div class="seg" id="pMode">
      <button data-v="none">Off</button>
      <button data-v="run">Running</button>
      <button data-v="page">Page end</button>
    </div>
    <p class="hint" id="pModeHint"></p>
  </div>
  <div class="fld" id="pSumF">
    <span>Sum these columns</span>
    <div class="chips" id="pSum"></div>
  </div>
  <div class="pv" id="pv"></div>
  <p class="hint" id="pInfo"></p>
  <div class="acts">
    <button class="btn ghost" id="xlsxBtn">Export .xlsx</button>
    <button class="btn solid" id="printBtn">Print</button>
  </div>
</aside>

<dialog class="imp" id="imp" aria-labelledby="impH">
  <header>
    <h2 id="impH">Import <em>workbook</em></h2>
    <button class="ic" id="impX" aria-label="Close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
  </header>
  <div class="ibody">
    <button class="drop" id="impDrop"><b>Choose a workbook</b><span id="impName"></span></button>
    <input type="file" id="impFile" accept=".xlsx,.xlsm,.xls,.ods,.csv" hidden>
    <div class="isec" id="impBody" hidden>
      <div class="fld"><span>Sheet</span><div class="chips" id="impSheets"></div></div>
      <div class="fld">
        <span>Header row</span>
        <div class="line">
          <div class="step" id="impHdr" data-min="0" data-max="60">
            <button data-d="-1" tabindex="-1" aria-label="Earlier row">−</button>
            <input value="1" inputmode="numeric" autocomplete="off" aria-label="Header row number">
            <button data-d="1" tabindex="-1" aria-label="Later row">+</button>
          </div>
          <p class="hint" id="impHdrHint"></p>
        </div>
      </div>
      <div class="fld">
        <span>Columns</span>
        <div class="maps" id="impMap"></div>
        <p class="hint">Green: header matched · yellow: likely · red: guessed from the data · violet: set by you.</p>
      </div>
      <div class="fld">
        <span>Rows</span>
        <div class="seg two" id="impMode"><button data-m="append">Add to ledger</button><button data-m="replace">Replace ledger</button></div>
        <label class="ck"><input type="checkbox" id="impDup"> Skip rows already in the ledger</label>
        <label class="ck"><input type="checkbox" id="impCarry"> A blank name means the same drug as the row above</label>
      </div>
      <div class="fld"><span>Preview</span><div class="ipv" id="impPv"></div><p class="hint" id="impInfo"></p></div>
    </div>
  </div>
  <footer class="iacts">
    <button class="btn ghost" id="tplBtn">Download template</button>
    <span></span>
    <button class="btn ghost" id="impCancel">Cancel</button>
    <button class="btn solid" id="impGo" disabled>Import</button>
  </footer>
</dialog>

<div class="toast" id="toast" role="status"></div>
<div id="print"></div>

<script src="js/vendor/xlsx.full.min.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
